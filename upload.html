<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>永檔鏈 DocChain - 上傳文件</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            font-family: "Inter", "Helvetica Neue", sans-serif;
            background-color: #f3f4f6;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            min-height: 100vh;
        }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
                z-index: -1;
                opacity: 0.85;
            }

        /* Header (與首頁統一) */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

            header.scrolled {
                background: rgba(255, 255, 255, 0.85);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            }

        /* 毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05);
            border-radius: 1.5rem;
        }

        /* 上傳區塊 Drop Zone */
        .drop-zone {
            background: rgba(255, 255, 255, 0.5);
            border: 2px dashed #cbd5e1;
            border-radius: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

            .drop-zone input[type="file"] {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                opacity: 0;
                cursor: pointer;
                z-index: 10;
            }

            .drop-zone:hover, .drop-zone.dragover {
                border-color: #6366f1;
                background: rgba(224, 231, 255, 0.6);
                transform: scale(1.01);
                box-shadow: 0 10px 25px rgba(99, 102, 241, 0.1);
            }

        /* 輸入框 */
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #f8fafc;
            border: 1px solid transparent;
            border-radius: 0.75rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.3s;
        }

            .input-field:focus {
                background: white;
                outline: none;
                border-color: #818cf8;
                box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            }

            .input-field[readonly] {
                background: #f1f5f9;
                color: #94a3b8;
                cursor: not-allowed;
            }

        /* 主要按鈕 */
        .primary-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            font-weight: 600;
            padding: 1rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

            .primary-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            }

            .primary-btn:disabled {
                background: #cbd5e1;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

            .primary-btn::after {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
                transition: 0.5s;
            }

            .primary-btn:hover::after {
                left: 100%;
            }

        .loader {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="max-w-7xl mx-auto px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="home.html" class="flex items-center gap-2 group">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg group-hover:scale-110 transition-transform">
                    <i data-feather="box" class="w-5 h-5"></i>
                </div>
                <span class="text-xl font-bold text-slate-800 tracking-tight group-hover:text-indigo-600 transition-colors">永檔鏈 DocChain</span>
            </a>

            <nav class="flex items-center space-x-8">
                <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">
                    <a href="home.html" class="hover:text-indigo-600 transition-colors">首頁</a>
                    <a href="upload.html" class="text-indigo-600 font-semibold">上傳</a>
                    <a href="verify.html" class="hover:text-indigo-600 transition-colors">驗證</a>
                    <a href="files.html" class="hover:text-indigo-600 transition-colors">檔案管理</a>
                </div>

                <div class="relative">
                    <button id="connectWalletBtn" class="flex items-center gap-2 bg-white/80 hover:bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:shadow transition-all backdrop-blur-sm">
                        <span id="walletText">🔐 連接錢包</span>
                    </button>
                    <div id="logoutMenu" class="hidden absolute right-0 mt-2 w-40 bg-white/90 backdrop-blur-xl shadow-xl rounded-2xl border border-slate-100 overflow-hidden transform origin-top-right transition-all">
                        <button id="logoutBtn" class="w-full text-left px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-red-500 transition-colors flex items-center gap-2">
                            <i data-feather="log-out" class="w-4 h-4"></i> 登出
                        </button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="pt-32 pb-20 px-4">
        <div class="max-w-4xl mx-auto glass-card p-8 md:p-10 fade-up">
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">上傳文件存證</h1>
                <p class="text-slate-500 text-sm md:text-base">
                    將文件上傳至區塊鏈與 IPFS，建立永久且不可篡改的數位指紋。
                </p>
            </div>

            <div id="uploadBox" class="drop-zone p-8 text-center cursor-pointer mb-8 flex flex-col items-center justify-center min-h-[180px]">
                <input type="file" id="fileInput" />
                <div class="w-14 h-14 bg-indigo-50 rounded-full flex items-center justify-center mb-4 text-indigo-500 pointer-events-none transition-colors group-hover:bg-indigo-100">
                    <i data-feather="upload-cloud" class="w-7 h-7"></i>
                </div>
                <p class="text-slate-700 font-medium mb-1 pointer-events-none text-lg">拖曳或點擊上傳文件</p>
                <p id="fileNameLabel" class="text-slate-400 text-sm pointer-events-none">支援圖片、PDF 與文字檔</p>
            </div>

            <div class="grid gap-6 md:grid-cols-2 mb-8">
                <div>
                    <label class="block text-slate-700 text-sm font-semibold mb-2 flex items-center gap-2">
                        <i data-feather="link" class="w-4 h-4 text-indigo-500"></i> 上一位的 NodeHash
                    </label>
                    <input id="prevHashInput" type="text" readonly class="input-field font-mono text-sm"
                           placeholder="請先選取檔案，系統將自動填入..." />
                    <p class="text-xs text-slate-400 mt-1 pl-1">系統自動偵測簽署順序，無法手動修改。</p>
                </div>

                <div class="bg-slate-50/80 p-5 rounded-xl border border-slate-100/50">
                    <label class="block text-slate-700 text-sm font-semibold mb-3 flex items-center gap-2">
                        <i data-feather="settings" class="w-4 h-4 text-purple-500"></i> 權限設定 (可選)
                    </label>

                    <input id="nextSignerInput" type="text" class="input-field mb-3 text-sm"
                           placeholder="指定下一位簽署者地址 (0x...)" />

                    <div class="flex items-center">
                        <input id="lockFileCheckbox" type="checkbox"
                               class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500 cursor-pointer">
                        <label for="lockFileCheckbox" class="ml-2 text-sm text-slate-600 font-medium cursor-pointer select-none">
                            🚫 鎖定文件 <span class="text-slate-400 text-xs">(禁止後續簽署)</span>
                        </label>
                    </div>
                </div>
            </div>

            <button id="uploadBtn" onclick="uploadFile()" class="primary-btn text-lg">
                開始上傳與存證
            </button>

            <div id="loading" class="mt-6 text-center hidden">
                <div class="loader"></div>
                <p class="mt-3 text-slate-500 font-medium text-sm animate-pulse">正在寫入區塊鏈，請稍候...</p>
            </div>

            <div id="result" class="mt-6 hidden text-sm md:text-base p-4 rounded-xl border"></div>
        </div>
    </main>

    <footer class="text-center text-slate-400 text-sm py-8">
        © 2025 永檔鏈 DocChain · Powered by IPFS & Ethereum
    </footer>

    <script src="auth.js"></script>
    <script src="upload.js"></script>
    <script>
        feather.replace();

        // Header 滾動監聽
        window.addEventListener("scroll", () => {
            const header = document.querySelector("header");
            if (window.scrollY > 20) header.classList.add("scrolled");
            else header.classList.remove("scrolled");
        });

        // 拖曳視覺效果
        const dropZone = document.getElementById("uploadBox");
        if (dropZone) {
            dropZone.addEventListener("dragover", (e) => {
                e.preventDefault(); dropZone.classList.add("dragover");
            });
            dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
            dropZone.addEventListener("drop", (e) => {
                e.preventDefault(); dropZone.classList.remove("dragover");
                const fileInput = document.getElementById("fileInput");
                if (e.dataTransfer.files.length > 0) {
                    fileInput.files = e.dataTransfer.files;
                    const event = new Event('change');
                    fileInput.dispatchEvent(event);
                }
            });
        }
    </script>
</body>
</html>
