<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>永檔鏈 DocChain - 檔案管理</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        /* ===== 全域背景風格 (與 Verify 一致) ===== */
        body {
            font-family: "Inter", "Helvetica Neue", sans-serif;
            background-color: #f3f4f6;
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            min-height: 100vh;
        }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
                z-index: -1;
                opacity: 0.85;
            }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

            header.scrolled {
                background: rgba(255, 255, 255, 0.85);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            }

        /* 毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05);
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            /* 確保內容撐開時佈局正常 */
        }

        /* 按鈕風格 */
        .primary-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

            .primary-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            }

        /* 分頁按鈕樣式 */
        .pagination-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(203, 213, 225, 0.6);
            background: rgba(255, 255, 255, 0.6);
            color: #475569;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

            .pagination-btn:hover:not(:disabled) {
                background: #ffffff;
                color: #4f46e5;
                border-color: #a5b4fc;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            }

            .pagination-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                background: rgba(241, 245, 249, 0.5);
            }

        /* 表格優化 */
        .table-container {
            overflow-x: auto;
            border-radius: 1rem;
            min-height: 300px; /* 確保沒有檔案時也有高度 */
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background: rgba(241, 245, 249, 0.6);
            text-transform: uppercase;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            color: #64748b;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        td {
            padding: 1rem 1.5rem;
            font-size: 0.95rem;
            color: #334155;
            border-bottom: 1px solid rgba(241, 245, 249, 0.6);
            transition: all 0.2s;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.6);
        }

        /* Modal */
        .modal-bg {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
        }

        /* Loader */
        .loader {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast */
        #toast {
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

            #toast.show {
                transform: translateY(0);
            }
    </style>
</head>

<body>
    <header>
        <div class="max-w-7xl mx-auto px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="home.html" class="flex items-center gap-2 group">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg group-hover:scale-110 transition-transform">
                    <i data-feather="box" class="w-5 h-5"></i>
                </div>
                <span class="text-xl font-bold text-slate-800 tracking-tight group-hover:text-indigo-600 transition-colors">永檔鏈 DocChain</span>
            </a>

            <nav class="flex items-center space-x-8">
                <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">
                    <a href="home.html" class="hover:text-indigo-600 transition-colors">首頁</a>
                    <a href="upload.html" class="hover:text-indigo-600 transition-colors">上傳</a>
                    <a href="verify.html" class="hover:text-indigo-600 transition-colors">驗證</a>
                    <a href="files.html" class="text-indigo-600 font-semibold">檔案管理</a>
                </div>

                <div class="relative">
                    <button id="connectWalletBtn" class="flex items-center gap-2 bg-white/80 hover:bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:shadow transition-all backdrop-blur-sm">
                        <span id="walletText">🔐 連接錢包</span>
                    </button>
                    <div id="logoutMenu" class="hidden absolute right-0 mt-2 w-40 bg-white/90 backdrop-blur-xl shadow-xl rounded-2xl border border-slate-100 overflow-hidden transform origin-top-right transition-all">
                        <button id="logoutBtn" class="w-full text-left px-4 py-3 text-sm text-slate-600 hover:bg-slate-50 hover:text-red-500 transition-colors flex items-center gap-2">
                            <i data-feather="log-out" class="w-4 h-4"></i> 登出
                        </button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="pt-32 pb-20 px-4 sm:px-6">
        <div class="max-w-7xl mx-auto glass-card p-8 md:p-10 fade-up">

            <div class="flex flex-col sm:flex-row justify-between items-end sm:items-center gap-4 mb-6 border-b border-slate-200/60 pb-6">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">我的檔案庫</h1>
                    <p class="text-slate-500 text-sm md:text-base">管理在區塊鏈上存證的所有文件。</p>
                </div>

                <button onclick="loadFiles()" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium flex items-center gap-1 px-3 py-2 rounded-lg hover:bg-indigo-50 transition">
                    <i data-feather="refresh-cw" class="w-4 h-4"></i> 重新整理
                </button>
            </div>

            <div class="table-container mb-4">
                <table class="min-w-full">
                    <thead>
                        <tr>
                            <th class="text-left w-1/3">檔案名稱 <span class="text-[10px] text-slate-400 font-normal ml-1"></span></th>
                            <th class="text-left">上傳時間</th>
                            <th class="text-center">操作</th>
                            <th class="text-center">狀態</th>
                        </tr>
                    </thead>
                    <tbody id="fileTable">
                        <tr>
                            <td colspan="4" class="px-6 py-20 text-center text-slate-400">
                                <div class="flex flex-col items-center justify-center gap-3">
                                    <div class="loader"></div>
                                    <span>正在讀取區塊鏈資料...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-slate-200/50">

                <div class="flex items-center gap-3">
                    <button id="prevPageBtn" disabled class="pagination-btn">
                        <i data-feather="chevron-left" class="w-4 h-4"></i> 上一頁
                    </button>
                    <button id="nextPageBtn" disabled class="pagination-btn">
                        下一頁 <i data-feather="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <div id="detailsModal" class="fixed inset-0 z-[60] hidden modal-bg flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-8 shadow-2xl w-full max-w-xl transform scale-95 transition-transform duration-300 relative">

            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-feather="file-text" class="text-indigo-500"></i> 檔案憑證細節
                </h3>
                <button id="closeModalBtn" class="p-2 hover:bg-slate-100 rounded-full transition text-slate-500">
                    <i data-feather="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div id="modalContent" class="space-y-5">
            </div>

            <div class="mt-8 flex gap-3">
                <button id="confirmModalBtn" class="primary-btn w-full justify-center">
                    確定
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed right-6 bottom-6 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-xl flex items-center gap-3">
        <span id="toastIcon">✅</span>
        <span id="toastMessage" class="font-medium">操作成功</span>
    </div>

    <footer class="text-center text-slate-400 text-sm py-8">
        © 2025 永檔鏈 DocChain · Powered by IPFS & Ethereum
    </footer>

    <script src="auth.js"></script>
    <script src="files.js"></script>

    <script>
        feather.replace();

        window.addEventListener("scroll", () => {
            const header = document.querySelector("header");
            if (window.scrollY > 20) header.classList.add("scrolled");
            else header.classList.remove("scrolled");
        });

        function showToast(msg, type = 'success') {
            const toast = document.getElementById("toast");
            const msgEl = document.getElementById("toastMessage");
            const iconEl = document.getElementById("toastIcon");

            msgEl.textContent = msg;
            iconEl.textContent = type === 'success' ? '✅' : '⚠️';

            if (type === 'error') {
                toast.classList.remove('bg-slate-800');
                toast.classList.add('bg-red-600');
            } else {
                toast.classList.add('bg-slate-800');
                toast.classList.remove('bg-red-600');
            }

            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        window.showToast = showToast;
    </script>
</body>

</html>
